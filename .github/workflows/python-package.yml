# CI validates the strategy engine on Linux; MT5 runtime dependencies remain
# in requirements.txt for the broker/terminal environment.
name: Python package

on:
  push:
    branches: [ "main", "v5.1-development" ]
  pull_request:
    branches: [ "main", "v5.1-development" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements-ci.txt
    - name: Validate project imports
      env:
        PYTHONPATH: ${{ github.workspace }}
      run: |
        python -m compileall -q .
        python -c "import config.settings, core.models, core.scanner, journal.decision_journal, market.structure, risk.trade_gates"
    - name: Static release security gate
      env:
        PYTHONPATH: ${{ github.workspace }}
      run: |
        python - <<'PY'
        from pathlib import Path
        from security.release_security_gate import evaluate_paths

        files = list(Path('.').rglob('*.py'))
        passed, findings = evaluate_paths(files)
        if not passed:
            for finding in findings:
                print(f"SECURITY GATE: {finding.rule} in {finding.path}")
            raise SystemExit(1)
        print(f"Security gate passed for {len(files)} production Python files")
        PY
    - name: Lint with flake8
      env:
        PYTHONPATH: ${{ github.workspace }}
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      env:
        PYTHONPATH: ${{ github.workspace }}
      run: |
        pytest -q

  release-evidence:
    name: Release evidence
    runs-on: ubuntu-latest
    needs: build
    if: ${{ needs.build.result == 'success' }}
    permissions:
      contents: read
      actions: read
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.sha }}
        fetch-depth: 1
    - name: Create and verify source archive
      run: |
        python -m utils.source_archive build --repo . --commit "$GITHUB_SHA" \
          --output "shreek9scalp-source-$GITHUB_SHA.zip" > shreek-source-archive-report.json
    - name: Generate immutable CI provenance
      env:
        PYTHONPATH: ${{ github.workspace }}
      run: |
        python - <<'PY'
        import hashlib
        import json
        import os
        from pathlib import Path
        from datetime import datetime, timezone

        commit_sha = os.environ["GITHUB_SHA"].lower()
        if len(commit_sha) != 40 or any(c not in "0123456789abcdef" for c in commit_sha):
            raise SystemExit("invalid GITHUB_SHA")

        archive_path = Path("shreek9scalp-source-" + commit_sha + ".zip")
        archive_report = json.loads(Path("shreek-source-archive-report.json").read_text(encoding="utf-8"))
        actual_archive_sha256 = hashlib.sha256(archive_path.read_bytes()).hexdigest()
        if (
            archive_report.get("state") != "source_content_verified"
            or archive_report.get("commit_sha") != commit_sha
            or archive_report.get("archive_sha256") != actual_archive_sha256
            or archive_report.get("source_commit_verified") is not True
            or archive_report.get("source_tree_verified") is not True
        ):
            raise SystemExit("source archive verification report does not match this CI checkout")

        files = []
        for path in sorted(Path(".").rglob("*.py")):
            if any(part in {".git", ".venv", "venv", "__pycache__"} for part in path.parts):
                continue
            digest = hashlib.sha256(path.read_bytes()).hexdigest()
            files.append({"path": str(path), "sha256": digest})

        payload = {
            "schema": "shreek.ci-provenance.v2",
            "workflow": os.environ["GITHUB_WORKFLOW"],
            "run_id": os.environ["GITHUB_RUN_ID"],
            "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
            "repository": os.environ["GITHUB_REPOSITORY"],
            "ref": os.environ["GITHUB_REF"],
            "commit_sha": commit_sha,
            "event": os.environ["GITHUB_EVENT_NAME"],
            "recorded_at": datetime.now(timezone.utc).isoformat(),
            "source_archive": {
                "file": archive_path.name,
                "archive_sha256": actual_archive_sha256,
                "tree_sha": archive_report["tree_sha"],
                "file_count": archive_report["file_count"],
                "manifest_sha256": archive_report["manifest_sha256"],
                "state": archive_report["state"],
            },
            "production_python_files": files,
        }
        canonical = json.dumps(payload, sort_keys=True, separators=(",", ":")).encode("utf-8")
        payload["manifest_sha256"] = hashlib.sha256(canonical).hexdigest()
        Path("shreek-ci-provenance.json").write_text(
            json.dumps(payload, sort_keys=True, indent=2) + "\n", encoding="utf-8"
        )
        print(json.dumps({
            "run_id": payload["run_id"],
            "commit_sha": payload["commit_sha"],
            "source_archive_sha256": actual_archive_sha256,
            "manifest_sha256": payload["manifest_sha256"],
        }, sort_keys=True))
        PY
    - name: Upload release evidence
      uses: actions/upload-artifact@v4
      with:
        name: shreek-ci-provenance-${{ github.sha }}-${{ github.run_id }}
        path: shreek-ci-provenance.json
        if-no-files-found: error
        retention-days: 90
    - name: Upload source archive
      uses: actions/upload-artifact@v4
      with:
        name: shreek9scalp-source-${{ github.sha }}
        path: shreek9scalp-source-${{ github.sha }}.zip
        if-no-files-found: error
        retention-days: 30

