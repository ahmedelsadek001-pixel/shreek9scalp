# CI validates the strategy engine on Linux; MT5 runtime dependencies remain
# in requirements.txt for the broker/terminal environment.
name: Python package

on:
  push:
    branches: [ "main", "v5.1-development" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements-ci.txt
    - name: Validate project imports
      env:
        PYTHONPATH: ${{ github.workspace }}
      run: |
        python -m compileall -q .
        python -c "import config.settings, core.models, core.scanner, journal.decision_journal, market.structure, risk.trade_gates"
    - name: Static release security gate
      env:
        PYTHONPATH: ${{ github.workspace }}
      run: |
        python - <<'PY'
        from pathlib import Path
        from security.release_security_gate import evaluate_tree

        files = []
        for path in Path('.').rglob('*.py'):
            if any(part in {'.git', '.venv', 'venv', '__pycache__'} for part in path.parts):
                continue
            files.append((str(path), path.read_text(encoding='utf-8')))
        passed, findings = evaluate_tree(files)
        if not passed:
            for finding in findings:
                print(f"SECURITY GATE: {finding.rule} in {finding.path}")
            raise SystemExit(1)
        print(f"Security gate passed for {len(files)} Python files")
        PY
    - name: Lint with flake8
      env:
        PYTHONPATH: ${{ github.workspace }}
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      env:
        PYTHONPATH: ${{ github.workspace }}
      run: |
        pytest -q
